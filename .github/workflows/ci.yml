name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        # Version comes from the packageManager field in package.json, the same
        # one corepack uses locally and on Vercel, so all three agree.
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "🧪 Run tests with coverage"
        run: pnpm run test:coverage

      - name: "☂️ Upload coverage to Codecov"
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧹 Checking for invisible characters"
        run: pnpm run clean:check

      - name: "🚀 Build the project"
        run: pnpm run build
